[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paradigma-studio"
version = "0.6.0a3"
description = "ParaDigMa Studio: Windows interface for the official ParaDigMa toolbox"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "paradigma==1.1.2",
    "PySide6==6.11.2",
    "matplotlib==3.11.2",
    "threadpoolctl==3.7.0",
    # PyPI 0.0.1 overflows when reading fractional CWA timestamps with NumPy 2.
    "openmovement @ git+https://github.com/digitalinteraction/openmovement-python.git@087ac7b5a80b866c400d8021b7a2716d247fc034",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "coverage==7.16.2",
    "pyinstaller==6.22.3",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pandas-stubs==2.3.3.260113",
]

[project.gui-scripts]
paradigma-studio = "paradigma_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paradigma_studio = ["py.typed", "data/*", "data/notices/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["scientific: numerical equivalence with independent official ParaDigMa workflows"]

[tool.coverage.run]
branch = true
source = ["src/paradigma_studio"]
relative_files = true
concurrency = ["thread", "multiprocessing"]
patch = ["subprocess", "_exit"]

[tool.coverage.report]
# Begin with orchestration and failure boundaries; measure new controllers too.
include = [
    "src/paradigma_studio/**/*_controller.py",
    "src/paradigma_studio/analysis_process.py",
    "src/paradigma_studio/core.py",
    "src/paradigma_studio/jobs.py",
    "src/paradigma_studio/parallel_analysis.py",
    "src/paradigma_studio/previews.py",
    "src/paradigma_studio/recording_results.py",
    "src/paradigma_studio/storage.py",
    "src/paradigma_studio/result_preparation.py",
    "src/paradigma_studio/result_reopening.py",
]
fail_under = 80
precision = 1
show_missing = true
include_namespace_packages = true

[tool.coverage.xml]
output = "test-reports/coverage.xml"

[tool.coverage.html]
directory = "test-reports/coverage-html"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "B", "C4", "SIM", "UP", "I", "C90",
    "PLR0912", "PLR0915", "RUF100",
]

[tool.ruff.lint.flake8-bugbear]
# QModelIndex is an immutable Qt value. Empty indexes are the conventional
# defaults on QAbstractItemModel overrides, matching Qt's public signatures.
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 60
max-branches = 12

[tool.mypy]
python_version = "3.11"
files = [
    "src/paradigma_studio/contracts.py",
    "src/paradigma_studio/core.py",
    "src/paradigma_studio/recordings.py",
    "src/paradigma_studio/inspection.py",
    "src/paradigma_studio/history.py",
    "src/paradigma_studio/jobs.py",
    "src/paradigma_studio/analysis_process.py",
    "src/paradigma_studio/analysis_limits.py",
    "src/paradigma_studio/parallel_analysis.py",
    "src/paradigma_studio/recording_results.py",
    "src/paradigma_studio/serialization.py",
    "src/paradigma_studio/epoch_profile.py",
    "src/paradigma_studio/analysis_controller.py",
    "src/paradigma_studio/data_controller.py",
    "src/paradigma_studio/job_controller.py",
    "src/paradigma_studio/result_controller.py",
    "src/paradigma_studio/export_controller.py",
    "src/paradigma_studio/shell_controller.py",
    "src/paradigma_studio/workspace_state.py",
    "src/paradigma_studio/result_data.py",
    "src/paradigma_studio/result_preparation.py",
    "src/paradigma_studio/result_reopening.py",
    "src/paradigma_studio/previews.py",
    "src/paradigma_studio/storage.py",
    "src/paradigma_studio/exports.py",
    "src/paradigma_studio/ui",
]
# Check service/controller APIs and every UI module, including new builders.
# UI annotations remain gradual; strict service/controller settings stay below.
follow_imports = "silent"
disallow_incomplete_defs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "paradigma_studio.analysis_controller",
    "paradigma_studio.data_controller",
    "paradigma_studio.job_controller",
    "paradigma_studio.result_controller",
    "paradigma_studio.export_controller",
    "paradigma_studio.shell_controller",
    "paradigma_studio.workspace_state",
    "paradigma_studio.result_data",
    "paradigma_studio.result_preparation",
    "paradigma_studio.result_reopening",
    "paradigma_studio.previews",
    "paradigma_studio.storage",
    "paradigma_studio.exports",
]
# Require complete annotations and check nested helpers in this expanded scope.
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["paradigma_studio.ui.*"]
# Check UI bodies while annotations are introduced gradually.
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["paradigma.*", "openmovement.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["threadpoolctl"]
# The native thread-limit helper ships neither stubs nor a py.typed marker.
ignore_missing_imports = true
