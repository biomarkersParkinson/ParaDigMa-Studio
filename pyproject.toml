[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paradigma-studio"
version = "0.5.32"
description = "ParaDigMa Studio: Windows interface for the official ParaDigMa toolbox"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "paradigma==1.1.2",
    "PySide6==6.11.2",
    "matplotlib==3.11.2",
    # PyPI 0.0.1 overflows when reading fractional CWA timestamps with NumPy 2.
    "openmovement @ git+https://github.com/digitalinteraction/openmovement-python.git@087ac7b5a80b866c400d8021b7a2716d247fc034",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pyinstaller==6.22.3",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pandas-stubs==2.3.3.260113",
]

[project.gui-scripts]
paradigma-studio = "paradigma_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paradigma_studio = ["py.typed", "data/*", "data/notices/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["scientific: numerical equivalence with independent official ParaDigMa workflows"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = [
    "src/paradigma_studio/contracts.py",
    "src/paradigma_studio/core.py",
    "src/paradigma_studio/recordings.py",
    "src/paradigma_studio/history.py",
    "src/paradigma_studio/jobs.py",
    "src/paradigma_studio/analysis_process.py",
    "src/paradigma_studio/serialization.py",
]
# Start with service APIs. Unannotated private helpers and the Qt UI can be
# typed incrementally; imported modules still supply their available contracts.
follow_imports = "silent"
disallow_incomplete_defs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["paradigma.*", "openmovement.*"]
ignore_missing_imports = true
