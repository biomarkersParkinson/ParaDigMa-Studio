[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paradigma-desktop"
version = "0.5.23"
description = "Windows desktop interface for the official ParaDigMa toolbox"
requires-python = ">=3.11,<3.14"
dependencies = [
    "paradigma==1.1.2",
    "PySide6==6.11.2",
    "matplotlib==3.11.2",
    # PyPI 0.0.1 overflows when reading fractional CWA timestamps with NumPy 2.
    "openmovement @ git+https://github.com/digitalinteraction/openmovement-python.git@087ac7b5a80b866c400d8021b7a2716d247fc034",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyinstaller==6.22.3", "ruff==0.16.10"]

[project.gui-scripts]
paradigma-desktop = "paradigma_desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paradigma_desktop = ["data/*", "data/notices/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["scientific: numerical equivalence with independent official ParaDigMa workflows"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Qt platform configuration must precede imports that can initialize Qt.
"tests/test_workspace.py" = ["E402"]
