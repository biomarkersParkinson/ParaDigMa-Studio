[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paradigma-desktop"
version = "0.1.1"
description = "Windows desktop interface for the official ParaDigMa toolbox"
requires-python = ">=3.11,<3.14"
dependencies = ["paradigma==1.1.2", "PySide6==6.11.2", "matplotlib==3.11.2", "openmovement==0.0.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyinstaller==6.22.3"]

[project.gui-scripts]
paradigma-desktop = "paradigma_desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
