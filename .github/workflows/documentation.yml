name: Documentation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check maintained Markdown
        run: npm exec --yes --package markdownlint-cli2@0.18.1 -- markdownlint-cli2
      - name: List all repository Markdown for link checking
        run: git ls-files '*.md' > "$RUNNER_TEMP/documentation-files.txt"
      - name: Install pinned Lychee with download retries
        timeout-minutes: 5
        env:
          LYCHEE_VERSION: '0.21.0'
        run: |
          tool_dir="$RUNNER_TEMP/lychee-$LYCHEE_VERSION"
          mkdir -p "$tool_dir"
          archive="$tool_dir/lychee.tar.gz"
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-v$LYCHEE_VERSION/lychee-$(uname -m)-unknown-linux-gnu.tar.gz"
          curl --fail --show-error --location \
            --retry 5 --retry-connrefused --retry-max-time 180 \
            --connect-timeout 15 --max-time 60 \
            --output "$archive" "$url"
          tar -xzf "$archive" -C "$tool_dir" lychee
          "$tool_dir/lychee" --version
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Check local files, images and heading anchors
        run: |
          lychee --config .lychee.toml --files-from "$RUNNER_TEMP/documentation-files.txt" \
            --format markdown --mode task --output "$RUNNER_TEMP/lychee-report.md"
          if grep -Eq 'Total[[:space:]]+\|[[:space:]]+0([[:space:]]|$)' "$RUNNER_TEMP/lychee-report.md"; then
            echo "::error::Lychee found no links; check the documentation input list."
            exit 1
          fi
      - name: Publish link-check summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/lychee-report.md" ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/lychee-report.md"
          fi
