name: Windows desktop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade "pip>=26.2,<27"
      - run: python -m pip install -e ".[dev]" "pip-audit==2.10.1"
      - name: Audit installed dependencies
        run: python scripts/audit_dependencies.py dependency-audit.json
      - name: Check Python style and imports
        run: |
          python -m ruff check src scripts tests desktop.py
          python -m ruff format --check src scripts tests desktop.py
      - name: Run app and scientific equivalence tests
        run: python -m pytest --junitxml=test-results.xml
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ParaDigMaDesktop-test-results
          path: test-results.xml
          if-no-files-found: ignore
      - name: Build Windows application with native runtime libraries
        run: python scripts/build_desktop.py
      - name: Verify and launch the packaged executable
        run: python scripts/check_frozen.py dist/ParaDigMaDesktop/ParaDigMaDesktop.exe
      - name: Measure Windows startup and bundle size
        run: python scripts/benchmark_desktop.py dist/ParaDigMaDesktop/ParaDigMaDesktop.exe --report dist/ParaDigMaDesktop/performance.json
      - name: Measure Windows UI workflows
        run: python scripts/benchmark_workflows.py --report dist/ParaDigMaDesktop/ui-performance.json
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Measure Windows graph panning
        run: python scripts/benchmark_pan.py --report dist/ParaDigMaDesktop/pan-performance.json
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Record package versions, audit and bundle checksums
        run: python scripts/write_build_manifest.py dist/ParaDigMaDesktop dependency-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ParaDigMaDesktop-Windows
          path: dist/ParaDigMaDesktop/
          # Native dependencies use directories such as sklearn/.libs. Upload
          # only this bundle, including its hidden runtime directories.
          include-hidden-files: true
