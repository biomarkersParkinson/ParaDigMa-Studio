name: Windows desktop
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m PyInstaller --noconfirm --clean --windowed --name ParaDigMaDesktop --collect-all paradigma --collect-all openmovement desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: ParaDigMaDesktop-Windows
          path: dist/ParaDigMaDesktop/
