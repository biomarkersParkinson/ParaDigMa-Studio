<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Watch coordinate system, overhead view</title>
  <desc id="figure-description">Overhead view of a head and shoulders with both arms extended forward and bent inward at the elbows. On the left wrist, positive X points toward the fingers. On the right wrist, positive X points toward the elbow. On both watches, positive Y points toward 12 o’clock and positive Z points toward the viewer, shown by a circled dot.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #111; }
    .outline { fill: none; stroke: #111; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
    .axis line, .axis polyline { fill: none; stroke: #111; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; }
    .axis text { font-size: 23px; font-weight: 600; text-anchor: middle; }
  </style>
  <defs>
    <g id="out-of-plane-axis">
      <circle r="7.5" fill="white" stroke="#111" stroke-width="2"/>
      <circle r="2.7" fill="#111"/>
    </g>
  </defs>

