<title id="figure-title">Expected input sensor orientation: left and right arm</title>
<desc id="figure-description">Studio illustration of the expected positive input sensor axes for the left and right wrist. Map source columns and axis signs to the illustrated directions. Select the actual watch side; ParaDigMa applies its wrist-side adjustment during processing. The diagram shows the input before that adjustment. Each axis is one uninterrupted straight SVG line.</desc>
