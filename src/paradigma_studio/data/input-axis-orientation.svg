<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="800" viewBox="100 0 1000 800" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Watch coordinate system, overhead view</title>
  <desc id="figure-description">Overhead view of a head and shoulders with both arms extended forward and bent inward at the elbows. On the left wrist, positive X points toward the fingers. On the right wrist, positive X points toward the elbow. On both watches, positive Y points toward 12 o’clock and positive Z points toward the viewer, shown by a circled dot.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #111; }
    .outline { fill: none; stroke: #111; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
    .planar-axis-arrow { fill: none; stroke: #111; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; }
    .axis text { font-size: 23px; font-weight: 600; text-anchor: middle; }
  </style>
  <defs>
    <g id="planar-axis-arrow" class="planar-axis-arrow">
      <line x1="8" y1="0" x2="100" y2="0"/>
      <polyline points="86,-6 100,0 86,6"/>
    </g>
    <g id="out-of-plane-axis">
      <circle r="7.5" fill="white" stroke="#111" stroke-width="2"/>
      <circle r="2.7" fill="#111"/>
    </g>
  </defs>

  <rect width="1200" height="850" fill="white"/>
  <text x="600" y="56" font-size="40" font-weight="600" text-anchor="middle">Watch coordinate system</text>
  <g id="view-legend" font-size="20">
    <text x="566" y="96" text-anchor="end">Overhead view</text>
    <path d="M588 80v21" stroke="#b5b5b5" stroke-width="1.3"/>
    <use href="#out-of-plane-axis" xlink:href="#out-of-plane-axis" x="610" y="89"/>
    <text x="625" y="96">+Z toward the viewer</text>
  </g>
  <text x="377" y="183" font-size="25" text-anchor="middle">Left arm</text>
  <text x="823" y="183" font-size="25" text-anchor="middle">Right arm</text>

